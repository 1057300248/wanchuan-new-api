name: RC40 focused diagnostics
on:
  push:
    branches: [codex/rc40-full-integration-20260922]
    paths: [.github/workflows/rc40-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.repository == '1057300248/wanchuan-new-api' && github.ref == 'refs/heads/codex/rc40-full-integration-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a1ee61c51d727f74880d5570628e65f0c9b5177a
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Capture separate compiler and lint diagnostics
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          OUT="$RUNNER_TEMP/rc40-diagnostics"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/commit.txt"
          for SCRIPT in typecheck lint:ci copyright:check; do
            set +e
            bun run "$SCRIPT" > "$OUT/${SCRIPT//:/-}.log" 2>&1
            STATUS=$?
            set -e
            echo "$SCRIPT=$STATUS" | tee -a "$OUT/status.txt"
            cat "$OUT/${SCRIPT//:/-}.log"
          done
          echo 'Diagnostics only; status.txt contains failures. This job is not an acceptance gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc40-focused-diagnostics
          path: ${{ runner.temp }}/rc40-diagnostics/
          retention-days: 7
          if-no-files-found: error
