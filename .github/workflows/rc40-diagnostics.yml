name: RC40 focused diagnostics
on:
  push:
    branches: [codex/rc40-full-integration-20260922]
    paths: [.github/workflows/rc40-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    if: github.repository == '1057300248/wanchuan-new-api' && github.ref == 'refs/heads/codex/rc40-full-integration-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture completed candidate test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rc40-diagnostics"
          mkdir -p "$OUT"
          curl --fail --silent --show-error --location --max-time 90 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/1057300248/wanchuan-new-api/actions/jobs/106654014451/logs' -o "$OUT/frontend.log"
          python3 - <<'PY'
          import os, pathlib, re
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc40-diagnostics'
          text=(out/'frontend.log').read_text()
          text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',text)
          text=re.sub(r'^\d{4}-\d{2}-\d{2}T\S+ ', '', text, flags=re.M)
          marker=text.find('Failed Tests')
          (out/'failures.log').write_text(text[max(0,marker-200):])
          print('Historical frontend log captured; diagnostic only, not acceptance.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc40-full-failure-evidence
          path: ${{ runner.temp }}/rc40-diagnostics/
          retention-days: 7
          if-no-files-found: error
