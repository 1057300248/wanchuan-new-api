name: Import pinned upstream history

on:
  push:
    branches: [codex/upstream-import-20261018-55bb6b90]
    paths: [.github/workflows/import-upstream-20261018.yml]

permissions:
  contents: read

jobs:
  import:
    if: github.repository == '1057300248/wanchuan-new-api' && github.ref == 'refs/heads/codex/upstream-import-20261018-55bb6b90'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve the exact official upstream commits in an isolated reference
        env:
          UPSTREAM_SHA: 55bb6b903c63fcddbf71740d7267b653fe1dbd47
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/QuantumNous/new-api.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor 633b4c5b190dc1af99a2814391354d86948e7943 "$UPSTREAM_SHA"
          git push origin "$UPSTREAM_SHA:refs/heads/upstream/new-api-55bb6b90"
          printf 'Imported pinned upstream %s without changing the customization branch.\n' "$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
