name: RC40 stage-one source review
on:
  push:
    branches: [codex/rc40-full-integration-20260922]
    paths: [.github/workflows/rc40-stage1-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == '1057300248/wanchuan-new-api' && github.ref == 'refs/heads/codex/rc40-full-integration-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture source and upstream diff without changing a branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6691f29bd2feb3c89f9be396bfda169218f38176 HEAD
          git fetch --no-tags https://github.com/QuantumNous/new-api.git main
          UPSTREAM=$(git rev-parse FETCH_HEAD)
          git update-ref refs/heads/stage1-upstream "$UPSTREAM"
          git update-ref refs/heads/stage1-current HEAD
          OUT="$RUNNER_TEMP/stage1-source"
          mkdir -p "$OUT"
          git bundle create "$OUT/source.bundle" refs/heads/stage1-current refs/heads/stage1-upstream
          git log --format='%H %s' 0aec08fee811ec6136828fda790551b49e410301.."$UPSTREAM" > "$OUT/incoming.txt"
          git log -1 --format='%H%n%P%n%s' > "$OUT/base.txt"
          sha256sum "$OUT/source.bundle" > "$OUT/source.bundle.sha256"
          cat "$OUT/incoming.txt"
          echo 'Source review only. No writes, builds, releases, database access, paid upstream requests or deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc40-stage1-source-${{ github.sha }}
          path: ${{ runner.temp }}/stage1-source/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
