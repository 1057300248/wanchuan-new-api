name: Temporary PR Autofmt

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/image-history-lifecycle-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Format frontend
        working-directory: web
        run: bun run format

      - name: Commit formatted files and remove helper workflow
        run: |
          rm .github/workflows/autofmt-pr-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web .github/workflows/autofmt-pr-temp.yml
          git commit -m "chore: format image generation changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
