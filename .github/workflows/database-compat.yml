name: Database Compatibility

on:
  push:
    branches:
      - main
      - 'codex/**'
      - merge/wanchuan-main-customizations-20260904
  pull_request:
  workflow_dispatch:

env:
  GOWORK: 'off'

permissions:
  contents: read

concurrency:
  group: database-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite real migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Full unit suite
        run: go test ./...
      - name: Real SQLite production migration and CRUD
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: sqlite
        run: go test ./model -run '^(TestDatabaseCompatibilityReal|TestSupportTicketSchemaSQLite)$' -count=1 -v
      - name: Real SQLite payment binding migration and constraints
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: sqlite
        run: go test ./modules/chuanapi/payment -run '^TestPaymentOrderBindingDatabaseCompatibilityReal$' -count=1 -v

  mysql57:
    name: MySQL 5.7 real migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: compat
          MYSQL_DATABASE: newapi_compat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcompat --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure production-safe MySQL charset
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysql -uroot -pcompat
          -e "ALTER DATABASE newapi_compat CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Create independent MySQL log database
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysql -uroot -pcompat
          -e "CREATE DATABASE newapi_compat_log CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Real MySQL production migration, CRUD and BIGINT schema
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: mysql
          TEST_DATABASE_DSN: root:compat@tcp(127.0.0.1:3306)/newapi_compat?charset=utf8mb4&parseTime=true&loc=UTC
          TEST_LOG_DATABASE_DSN: root:compat@tcp(127.0.0.1:3306)/newapi_compat_log?charset=utf8mb4&parseTime=true&loc=UTC
          TEST_MYSQL_DSN: root:compat@tcp(127.0.0.1:3306)/newapi_compat?charset=utf8mb4&parseTime=true&loc=UTC
        run: go test ./model -run '^(TestDatabaseCompatibilityReal|TestMoneyColumnsAre64BitOnConfiguredDatabases|TestSupportTicketSchemaConfiguredDatabases)$' -count=1 -v
      - name: Real MySQL payment binding migration and constraints
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: mysql
          TEST_DATABASE_DSN: root:compat@tcp(127.0.0.1:3306)/newapi_compat?charset=utf8mb4&parseTime=true&loc=UTC
        run: go test ./modules/chuanapi/payment -run '^TestPaymentOrderBindingDatabaseCompatibilityReal$' -count=1 -v

  postgres96:
    name: PostgreSQL 9.6 real migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_PASSWORD: compat
          POSTGRES_DB: newapi_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_compat"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create independent PostgreSQL log database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres newapi_compat_log
      - name: Real PostgreSQL production migration, CRUD and BIGINT schema
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: postgres
          TEST_DATABASE_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat?sslmode=disable
          TEST_LOG_DATABASE_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat_log?sslmode=disable
          TEST_POSTGRES_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat?sslmode=disable
        run: go test ./model -run '^(TestDatabaseCompatibilityReal|TestMoneyColumnsAre64BitOnConfiguredDatabases|TestSupportTicketSchemaConfiguredDatabases)$' -count=1 -v
      - name: Real PostgreSQL payment binding migration and constraints
        env:
          TEST_DATABASE_COMPAT: "1"
          TEST_DATABASE_DIALECT: postgres
          TEST_DATABASE_DSN: postgres://postgres:compat@127.0.0.1:5432/newapi_compat?sslmode=disable
        run: go test ./modules/chuanapi/payment -run '^TestPaymentOrderBindingDatabaseCompatibilityReal$' -count=1 -v
