name: Kiro Authenticated Tenant

on:
  push:
    branches: ['codex/kiro-authenticated-tenant-20261001']
  pull_request:
    paths:
      - 'relay/channel/authenticated_tenant*.go'
      - 'relay/channel/api_request.go'
      - '.github/workflows/kiro-authenticated-tenant.yml'

permissions:
  contents: read

concurrency:
  group: kiro-tenant-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == '1057300248/wanchuan-new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply exact header hook on the dedicated push branch
        if: github.event_name == 'push'
        run: python3 maintenance/apply_authenticated_tenant.py
      - name: Format and inspect changes
        run: |
          gofmt -w relay/channel/authenticated_tenant.go relay/channel/authenticated_tenant_test.go relay/channel/api_request.go
          git diff --check
          git diff > tenant-source.patch
          git diff --exit-code -- go.mod go.sum relaykit/go.mod relaykit/go.sum
      - name: Channel regression tests
        run: go test -mod=readonly ./relay/channel -count=1 2>&1 | tee tenant-tests.log
      - name: Authentication regression tests
        run: go test -mod=readonly ./middleware -count=1 2>&1 | tee tenant-auth-tests.log
      - name: Vet modified package
        run: go vet -mod=readonly ./relay/channel 2>&1 | tee tenant-vet.log
      - name: Publish validated integration hook only
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=codex/kiro-authenticated-tenant-20261001
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$EXPECTED_SHA"
          git add relay/channel/authenticated_tenant.go relay/channel/authenticated_tenant_test.go relay/channel/api_request.go
          git diff --exit-code
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(relay): 接入已验证身份的租户头覆盖'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee tenant-published-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-validation-${{ github.run_id }}
          path: |
            tenant-*.log
            tenant-*.patch
            tenant-*.txt
          retention-days: 7
